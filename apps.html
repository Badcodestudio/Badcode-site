<style>
/* QR code shown on each app card (set it in Edit mode with the "QR code image" field) */
.qrwrap{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem 1.1rem;margin-bottom:1.3rem}
.qr{flex:0 0 auto;width:200px;height:220px;max-width:100%;object-fit:contain;background:#fff;border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.qrcap{color:var(--mute);font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;line-height:1.4}
</style>

<body>

<nav class="bar" aria-label="Pages">
  <div class="wrap">
    <a href="index.html">Home</a><a href="books.html">Books</a><a href="music.html">Music</a><a href="video.html">Video</a><a href="apps.html" aria-current="page">Apps</a><a href="photos.html">Photos</a>
  </div>

<main class="wrap">
  <header class="page-head"><h1 class="page-title">Apps</h1><p class="page-sub" data-count="apps"></p></header>
  <div id="load-error" class="loaderr hidden"></div>
  <div class="content"><div class="teasers apps-grid" data-list="apps" data-editable></div></div>
</main>

<footer id="contact">
  <div class="wrap">
    <div class="socials foot-social" data-list="socials"></div>
    <p>Production inquiries and custom work:<br>

  </div>

<div class="editbar" id="editbar">
  <div class="msg" id="edit-msg">Editing. Nothing is published until you tap Save.</div>
  <button class="ebtn save" id="btn-save" type="button">Save</button>
  <button class="ebtn" id="btn-done" type="button">Done</button>
  <button class="ebtn danger" id="btn-signout" type="button">Sign out</button>
</div>

<script src="site.js"></script>
<script>
/* Apps page extras: each app can carry a QR code image. */
SCHEMA.apps.blank.qr = "";
SCHEMA.apps.fields.push(["qr","QR code image","img"]);
PUBLIC.apps = a => `<a class="teaser" href="${esc(a.url)}" target="_blank" rel="noopener">${a.tag ? `<span class="tag">${esc(a.tag)}</span>` : ""}
    <h3>${esc(a.name)}</h3><p>${esc(a.blurb)}</p>${a.qr ? `<span class="qrwrap"><img class="qr" src="${esc(a.qr)}" alt="QR code for ${esc(a.name)}" loading="lazy"><span class="qrcap">Scan to<br>open</span></span>` : ""}<span class="go">Open ${esc(a.name)} &rarr;</span></a>`;
/* Fill transparent images with white so a QR code never turns black when uploaded. */
shrink = (file, max) => new Promise((res, rej) => {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    res(c.toDataURL("image/jpeg", 0.9).split(",")[1]);
  };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file is not an image the browser can read.")); };
  img.src = url;
});
</script>
</body>
